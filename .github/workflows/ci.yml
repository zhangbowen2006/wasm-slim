name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - run: moon update

      - run: moon check

      - run: moon test

      - name: Build both profiles
        run: |
          moon build --target wasm --release
          moon build --target wasm

      - name: Attribution on the release build
        run: moon run cmd -- _build/wasm/release/build/cmd/cmd.wasm

      - name: Gate passes a release build
        run: moon run cmd -- _build/wasm/release/build/cmd/cmd.wasm --check --budget 200000

      - name: Gate rejects a debug build
        run: |
          if moon run cmd -- _build/wasm/debug/build/cmd/cmd.wasm --check; then
            echo "expected the gate to fail on a debug build"
            exit 1
          fi
          echo "gate correctly failed on the debug build"

      - name: Gate rejects an over-budget build
        run: |
          if moon run cmd -- _build/wasm/release/build/cmd/cmd.wasm --check --budget 1000; then
            echo "expected the gate to fail when over budget"
            exit 1
          fi
          echo "gate correctly failed on the budget"

      - name: Diff against the checked-in snapshot
        run: moon run cmd -- _build/wasm/debug/build/cmd/cmd.wasm --diff fixtures/self.wasm

      - name: Top functions by size
        run: moon run cmd -- _build/wasm/debug/build/cmd/cmd.wasm --top 5

      - name: Strip and validate the result
        run: |
          moon run cmd -- _build/wasm/debug/build/cmd/cmd.wasm --strip --out /tmp/slim.wasm
          node -e "const fs=require('fs');const b=fs.readFileSync('/tmp/slim.wasm');if(!WebAssembly.validate(b)){console.error('invalid wasm');process.exit(1)}console.log('valid wasm',b.length,'bytes')"
